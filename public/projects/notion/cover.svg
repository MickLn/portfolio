<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="800" height="1000" fill="#FFFFFF"/>
  
  <!-- Subtle Minimalist Grid Lines -->
  <line x1="0" y1="500" x2="800" y2="500" stroke="#F5F5F5" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="1000" stroke="#F5F5F5" stroke-width="1"/>

  <!-- Centered Isometric Notion 3D Cube Logo from User Reference -->
  <g transform="translate(260, 340) scale(4.2)">
    <image width="64" height="67" xlink:href="data:image/png;base64," />
  </g>

  <!-- Clean Bottom Brand Tag -->
  <text x="400" y="740" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="20" font-weight="700" letter-spacing="8" fill="#1A1A1A">NOTION WORKSPACES</text>
  <text x="400" y="775" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#888888">SYSTEMS &amp; TEMPLATES</text>
</svg>
